name: Zeus
description: >-
  Zeus (Zeus Living) was a furnished and corporate housing rental startup
  founded by Kulveer Taggar (previously co-founder of Auctomatic with Patrick
  Collison). The company leased and managed furnished residences that it re-let
  to business travelers, relocating employees, and companies needing flexible
  medium-term housing, backed by investors including Bloomberg Beta. Zeus Living
  has since wound down operations; its zeusliving.com domain no longer resolves
  and it exposes no public developer portal, documentation, or API surface. This
  profile was surfaced as a Bloomberg Beta portfolio company and enriched by the
  API Evangelist pipeline, which confirmed no live API or web presence remains.
